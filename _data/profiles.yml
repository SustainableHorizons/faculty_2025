  : I have been actively mentoring graduate and undergraduate students at Binghamton
    University. The SRP program exposes my students to a complex, interdisciplinary
    research environment. I will mentor the student team under a structured, modular
    assignment framework. The team will learn the project goal and objectives. They
    will be assigned task modulars during weekly meetings and will be advised on finishing
    the tasks on time. As always, they will have also room to navigate and think of
    the box, which may lead to innovative solutions. Beyond the technical deliverables,
    I will emphasize the soft skills and career development goals central to the SRP
    mission, including presentational and writing skills. They will learn how to communicate
    complex interdisciplinary results to both expert and general audiences, preparing
    them for conference presentations and future career steps.
