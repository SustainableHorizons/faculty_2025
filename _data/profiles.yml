  : My approach emphasizes active mentorship aimed at helping students become self-directed
    researchers and practitioners capable of bridging mathematical theory with real-world
    applications. In terms of skill development, I will encourage students to gain
    experience in applied mathematical modeling and analysis, scientific writing and
    presentation, and collaborative research practices. The team’s research plan will
    include regular internal meetings and collaborations with researchers from the
    participating labs and projects, ensuring consistent communication and progress.
    My role as a mentor will be to guide students in defining and refining their research
    direction, helping them stay on the right path and optimize their efforts toward
    meaningful and measurable outcomes in a strongly collaborative setting. Since
    both students in my team are master’s students, an additional focus of my mentorship
    will be to support them through the dissemination process, aiming for a joint
    publication involving the students, myself, and our lab or project collaborators.
  ? 'Student Merit: Describe any past experience you have working with the each student
    on your team, and any other factors, such as their preparedness and/or aptitude,
