  Please describe your research/academic interests.: My research focuses on the intersection
    of compiler optimization, high-performance computing (HPC), and artificial intelligence.
    I study how compiler intermediate representations (LLVM and MLIR) can be enhanced
    with large language models (LLMs) to improve code optimization, program analysis,
    and performance portability across architectures. My current work develops hybrid
    quantum and AI-assisted compiler frameworks that automatically identify optimization
    opportunities—especially those missed by traditional static analyses, such as
    vectorization and GPU parallelization patterns. I am also interested in building
    reproducible datasets and open-source tools for IR-aware learning, enabling the
    research community to evaluate LLMs for compiler reasoning tasks. At Youngstown
    State University, I integrate these research topics into advanced systems and
    programming courses, mentoring undergraduate and graduate students in project-based
    research that connects compiler theory, machine learning, and HPC practice. My
    long-term goal is to create a sustainable research pathway that links regional
    universities with national laboratories to advance intelligent compiler systems
    and scalable scientific computing.
  'Please select all the topical areas that apply to your project:': Computer Science
  Research Synergy: My research naturally aligns with the mission of DOE and NSF laboratories
    to advance scalable, intelligent, and sustainable computing. The intersection
    of compiler optimization, AI, and high-performance computing offers fertile ground
    for collaboration with research groups developing next-generation programming
    models, runtime systems, and performance-portable workflows. My ongoing work on
    LLM-assisted compiler analysis and IR-level optimization can directly complement
    efforts in automatic performance tuning, heterogeneous code generation, and AI-for-Science
    initiatives within NAIRR and DOE’s Exascale Computing Project. By integrating
    large language models with traditional compiler infrastructures such as LLVM and
    MLIR, my team seeks to build interpretable AI agents that reason about code transformations
    and improve resilience and efficiency across architectures. Through SRP, I aim
    to collaborate with laboratory scientists to benchmark, validate, and extend these
    models using real scientific workloads and HPC benchmarks. Such collaborations
    would accelerate both compiler intelligence research and practical applications
    in data-intensive and simulation-driven computing, while providing students hands-on
    experience in scalable and trustworthy AI systems.
  Motivation: I want to participate in the Sustainable Research Pathways program because
    I see it as an opportunity to build lasting collaborations that connect research,
    education, and community impact. As a new faculty member at Youngstown State University,
    I am eager to establish partnerships that help my students experience research
    beyond the classroom and engage with national laboratories working on high-performance
    and AI-driven computing. My motivation also comes from my own academic journey.
    I benefited from mentors who opened doors to research computing when I was a student,
    and I want to create similar opportunities for my students, especially those from
    institutions with fewer resources. I believe SRP’s model of mentorship and collaboration
    fits perfectly with this goal. Through this program, I hope to contribute my experience
    in compiler and AI research, learn from scientists working on scalable systems,
    and help my students grow as independent researchers who see science as both accessible
    and collaborative.
  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
