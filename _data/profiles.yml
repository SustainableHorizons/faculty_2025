  Please describe your research/academic interests.: 'Since my undergraduate studies,
    I have been enthusiastic to work with Big Data. High Performance Computing (HPC)
    is one such arena closely related to Big Data. Learning the aspects of HPC, I
    aspire to become a prominent researcher and educator focusing on HPC, AI and Big
    Data. My research area intersects Big Data Analytics, High Performance Computing,
    Machine/Deep Learning, Generative AI, Large Language Models (LLMs), Parallel Algorithms,
    Large Graph Mining, Multi-core Architectures, Distributed Systems, and Security.
    I have been working on HPC since 2015 to present, with an experience of 9+ years.
    My research focuses on developing scalable parallel algorithms in various application
    domains using different HPC techniques. I also work on the scalability of neural
    networks on GPUs. I develop different prediction ML models and use LLMs for HPC
    Operational Data Analytics. I work on mining and analysis of both static and dynamic
    big social and information networks by designing parallel algorithms using HPC
    techniques. I am the lead author of 15 out of 22 published peer-reviewed full-length
    conferences / journals [Citation: 337, h-index: 9, i10-index: 9]. My collaborations
    at 4 national labs: Oak Ridge National Laboratory (ORNL), Pacific Northwest National
    Laboratory (PNNL), Lawrence Berkeley National Laboratory (Berkeley Lab), Los Alamos
    National Laboratory (LANL) is a testament of my HPC expertise in handling large-scale
    data and provided me the opportunity to work on different supercomputers. This
    experience has provided me with a strong foundation in the computational methods
    essential for research in engineering and science disciplines. My research agenda
    centers on interdisciplinary computational science at the nexus of High-Performance
    Computing (HPC), advanced AI modeling (including Large Language Models, or LLMs),
    and scalable Large Graph Analysis. Specifically, I focus on developing and implementing
    novel parallel algorithms to model and interrogate complex systems—such as geospatial
    data, urban infrastructure, biological networks, or social equity graphs—to extract
    actionable insights. My goal is to build computationally efficient and equitable
    AI tools that leverage national lab-scale resources to solve national challenging
    problems.'
  'Please select all the topical areas that apply to your project:': Applied Computer
    Science; Artificial Intelligence and Intelligent Systems; Atmospheric Sciences;
    Civil Engineering; Climate and Global Dynamics; Computer Science; Environmental
    Biology; Environmental Biotechnology; Environmental Engineering; Geology and Solid
    Earth Sciences; Health Sciences; Other Biological Sciences; Other Computer and
    Information Sciences; Performance Evaluation and Benchmarking
  Research Synergy: I keep my research area open for an interdisciplinary scientific
    domain where I can incorporate my HPC, Scalable AI, Parallel Algorithms, and Large
    Graph Modeling expertise. Complex urban systems and infrastructure resilience
    are key areas I want to explore. My expertise in Large Graph Analysis can be directly
    applied to modeling city infrastructure (e.g., transportation, utility networks)
    as complex networks, allowing for HPC-driven simulations of failures, cascading
    events, and optimization of resource allocation. I am particularly drawn to NAIRR
    projects focused on developing and training geospatial multimodal foundational
    models. With my expertise in Scalable AI and Graph Modeling, I can contribute
    to integrating complex, dynamic Graph-based data representations, leading to a
    more enriched and efficient foundational model for environmental and Earth science
    applications. Given that my student team possesses prior Biology/Health domain
    expertise, I am also enthusiastic about applying AI/HPC, complex network analysis,
    and parallel algorithms to large-scale biological or health datasets. This aligns
    with national efforts to address health disparities by developing scalable AI
    models for precision medicine or public health monitoring. I specifically aim
    to utilize the SRP program's resources to apply parallel algorithms, complex network
    analysis to large-scale datasets, potentially tackling problems related to scalable
    AI models, complex urban systems, environmental, or health domains.
  Motivation: 'My connection to this SRP program is deeply personal. I was a Past
