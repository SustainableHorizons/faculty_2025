  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
    Describe your plan for working with your student team.'
  : As described under “Student Merit”, I have a track record of successful collaboration
    with my PhD students, including on-going projects and long-term collaboration
    plans. Our ongoing research activities revolve around AI/ML, data science and
    scientific computing so we should be able to quickly kick-start our research agenda
    taking into account valuable inputs and suggestions from NAIRR project leader/research
    mentor. Based on these suggestions, we intend to develop a research proposal with
    our mentor that we are going to pursue during our research stay. As a faculty
    participant, my intention is to focus on methodological and theoretical developments,
