    and Probability
  Research Synergy: My research focuses on differential complementarity problems,
    applied mathematical methods in machine learning and AI, stochastic optimization,
    mathematical inequalities with applications in probability and approximation theory,
    and the planning and control of robotic systems. Within Applied Mathematics, my
    work contributes to the theoretical development of complementarity systems and
    to numerical methods for the simulation of rigid-body dynamics. In relationship
    to Statistics and Probability, I study mathematical inequalities with applications
    to probability theory, statistical learning, and approximation theory, developing
    analytical tools to assess generalization and uncertainty in data-driven models.
    In Artificial Intelligence, my research aims to bridge mathematical modeling and
    learning by developing optimization-based techniques that enhance the reliability,
    interpretability, and control of AI systems. One emerging direction involves applying
    mathematical tools from robot safe navigation to the large language model (LLM)
    setting, exploring how formal models of safety can inform the behavior of intelligent
    systems. The connection to Mechanical Engineering arises naturally through the
    planning and control of robotic systems, as well as through the design of complementarity-based
    numerical schemes for the simulation of rigid-body systems. Together, these lines
    of inquiry define an interdisciplinary research approach uniting mathematical
    theory, control theory, computational methods, and intelligent system design.
  Motivation: My motivation for participating in the Sustainable Research Pathways
    (SRP) Program comes from its strong alignment with my research focus, mentorship
    philosophy, and commitment to building new and productive research collaborations.
    The SRP framework offers a unique opportunity to work with laboratory researchers
    and scientists across disciplines, which represents a major incentive for my participation.
    Equally important, the program provides a valuable platform for the students on
    my team to engage in state-of-the-art research within a collaborative and interdisciplinary
    environment. Through SRP, I aim to introduce my students to the lab research ecosystem
    and help them strengthen their technical, analytical, and collaborative skills.
    I believe that a research partnership initiated through this program can serve
    as the foundation for long-term collaboration and joint publications at the intersection
    of applied mathematics, engineering sciences, and AI/machine learning.
  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
