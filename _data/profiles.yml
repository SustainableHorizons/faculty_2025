  Please describe your research/academic interests.: My research interests include
    Artificial Intelligence (AI) and Machine Learning (ML), High Performance Computing
    (HPC), data analytics, cybersecurity, and software engineering. I focus on solving
    complex real-world challenges in these fields and applying my problem-solving
    skills in these fields to solve problems at the intersection with other fields.
    Additionally, I aim to develop robust, scalable software systems for areas such
    as cybersecurity, high-performance computing, and scientific computation. I have
    applied AI and ML techniques to address real-world challenges across various domains.
    In the field of cybersecurity, I developed several ML-based solutions for network
    intrusion detection and botnet detection that boast a high detection rate and
    a low false alarm rate. In petroleum engineering, my team and I created an intelligent
    software tool that uses a hybrid supervised machine learning and deep learning
    method to predict shale oil production in real-time. This AI-based method is more
    efficient than conventional, computationally intensive simulations that are used
    in the petroleum engineering industry. A recent work also includes measuring the
    intrinsic complexity of datasets and developing methods to detect phishing attempts
    and other IoT-based security attacks. Recently, my student (Alexis Huante, who
    is included in this application) and I developed a new supervised ML classifier.
    I have explored the synergy between AI and HPC. In collaboration with scientists
    from Oak Ridge National Laboratory, my student and I evaluated the performance
    of the open-source Llama-2 model for generating HPC kernels. We compared its output
    to that of OpenAI's Codex model, discovering that Llama-2 produced more optimized
    code while Copilot generated more reliable code. These projects align with the
    mission of this program. I also conduct research on software engineering and formal
    methods to ensure the development of reliable and quality complex software systems.
    For example, I developed a tool that utilizes formal methods to detect design
    faults and validate temporal properties in software models. This tool paper was
    published in the ACM/IEEE International Conference on Software Engineering, the
    top-most conference in the software engineering field. I believe in supporting
    students' learning through research activities. Therefore, I directly involve
    students in my research. Many students have co-authored publications and, as a
    result of their research experience, have gone on to prestigious graduate programs
    at various institutions and embarked on careers at top IT companies.
