  Please describe your research/academic interests.: My research interests include
    advancing scientific computing through scalable infrastructures and AI-driven
    methods for the efficient analysis of multimodal, multidimensional (M3D) data
    from large-scale simulations and experimental facilities. I focus on reducing
    time-to-discovery by coupling HPC systems, machine learning, and innovative storage
    architectures. A central theme of my work is in-situ and in-transit computing,
    where data analytics and AI models are executed during or alongside simulations
    to reduce expensive data transfers. I develop HPC (High-performance computing)-AI
    powered storage solutions, including multi-tier designs, in-memory file systems,
    and intelligent caching strategies that optimize I/O performance, throughput,
    and energy efficiency. I also investigate the energy efficiency of multimodal
    large language models (MLLMs) in scientific workflows. By applying compression,
    quantization, and co-design techniques, I align MLLMs with HPC micro-architectures
    such as GPUs and emerging accelerators, enabling scalable yet sustainable deployment.
    Overall, my work integrates storage-aware design, micro-architectural optimizations,
    and energy-efficient AI methods into scientific domains such as NWChem, molecular
    dynamics and E3SM and Aligned with NAIRR priorities and FAIR principles, my research
    advances the next generation of scalable, trustworthy, and energy-efficient scientific
    computing.
