  Motivation: 'The SRP program aims to enhance workforce development among all backgrounds.
    My primary motivation to participate in the SRP program is personal and directly
    tied to the community I serve at TAMIU. As a Minority-Serving Institution (MSI),
    TAMIU serves as a vital lifeline for educational advancement and economic mobility
    in our region. TAMIU has a student population comprising 89.3% Hispanic students,
    76% from low-income backgrounds, and over 51% who are first-generation. The B.S.
    in Computer Engineering program, launched in the 2020-2021 academic year, has
    been an enormous success. It has been the fastest-growing program on campus since
    its launch. Given the community investment in the program, it is incumbent upon
    faculty members, such as me, to respond. One crucial way to achieve this is to
    consistently provide students with opportunities to conduct world-class research,
    which can further prepare them for an increasingly competitive job market. The
    SRP program and its collaborations with leading institutions are at the forefront
    of innovation and technology worldwide. There is no better place for students
    to develop their research skills and prepare for the workplace than at these institutions.
    Despite some recent improvements in workforce development, significant disparities
    persist in the STEM workforce. For example, Hispanics comprise just 6.9% of computer
    scientists in the United States, and the representation of women in this field
    is even lower. My mission as an educator and researcher is to help close this
    gap by creating tangible pathways for students, especially women and other underrepresented
    minorities, to succeed in computer science and engineering. In particular, I aim
    to do the following: (a) Increase the representation of Hispanics and other minority
    groups in higher education in Computer Science and Engineering. (b) Maintain collaborative
    relationships and establish new connections with scientists to conduct outstanding
    mission-critical research. (c) Apply to more grant proposals, especially the NSF
    NAIRR grant. (d) Promote the new Computer Engineering program at TAMIU. This will
    encourage more Hispanics to pursue degrees in Computer Science and engineering,
    as well as related fields. (e) Help my university, TAMIU, in obtaining the R2
    status. (f)  Facilitate the smooth transition of Hispanic students to graduate
    schools, national labs, and the workforce. (g) Write and disseminate research
    results, and conferences and other scientific venues. My experience in the SRP
    program during the 2023 summer was transformative for me and my students. It led
    to collaborations with scientists from Oak Ridge National Laboratory. We successfully
    established a research agenda that resulted in three grant proposals. I led one
    of these proposals as the PI, which I submitted to NSF. While these proposals
    were not funded, they deepened our collaborations and reinforced my commitment
    to this work. I am excited to continue our research, publish more papers, and
    build new partnerships. In summary, my motivation is to capitalize on this momentum.
    I want to increase the representation of Hispanic and other minority students
    in computing, facilitate their smooth transition to graduate schools and the workforce,
    and, in doing so, promote the success of TAMIU''s new Computer Engineering program.
    By continuing to create these sustainable connections, we can not only advance
    cutting-edge research but also cultivate a more diverse, inclusive, and robust
    scientific workforce for the future.'
  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
    Describe your plan for working with your student team.'
  : 'High-quality mentoring of undergraduate research assistants will be essential
    to the success of this application. They will conduct research and work closely
    with me during the summer research experience. I will be committed to helping
    the students plan and execute their chosen research projects. I will provide daily
    guidance and informal feedback to ensure students stay on track. The daily meetings
    will consist of the following activities: (i) Reviewing the students'' achievements
    and accomplishments towards completing the project. (ii) Discussing challenges
    and ideas to overcome the research problems. (ii) Establish the following tasks
    that the students must focus on achieving before the next meeting. The daily group
    meetings will provide a forum where students can ask questions, and I, as a faculty
    mentor, can monitor progress. The group members will maintain the group meeting
    minutes on a shared Google document to keep the team focused on achieving the
    project goals. The document will outline the goals of the projects, as well as
    the main accomplishments, challenges, and subsequent tasks discussed during the
    daily meetings. The team will elaborate on the main accomplishments of the week
    as progress reports at the end of the week. The progress reports and daily meeting
    minutes will serve as the basis for scientific publications upon project completion.
    In addition, I will lead by example and facilitate training in complementary skills
    essential for success as a computer scientist and engineer, such as communication,
    writing, management, and ethical behavior. Finally, I will discuss with students
    the responsible conduct of research, authorship, and other applicable ethical
    concerns. Since joining TAMIU in the fall of 2018, I have supervised more than
    50 undergraduate research projects. I believe in nurturing students'' desire to
    seek knowledge. I have developed my mentoring style by reflecting on my experience
    as a professor and a mentee. I have also enhanced my style and skills by implementing
    mentoring best practices from my training and experience. I have practiced and
    improved my skills through three research Bootcamp experiences at TAMIU and two
    NSF-funded Research Experiences for Undergraduates (REUs) at Columbus State University.
    Despite being a new program (the B.S. in Computer Engineering at TAMIU), I have
    successfully helped more than 15 students secure admissions to graduate schools
    at the University of Texas at San Antonio and Arizona State University. Additionally,
    many of my students have secured software development positions at Fortune 500
    companies before graduating from our program. A DOE National Lab has hired one
    of my students who participated in the previous SRP program. The fact that many
    students in my research groups have developed a significant interest in graduate
