  Please describe your research/academic interests.: Tejas grapples with research
    questions in computational perception, learning, reasoning, and communication.
    His research interests are broadly in AI, at the intersection of machine learning,
    computer vision, and natural language processing. The current research theme in
    our Cognitive Vision Group is "conceptual characterization of visual scenes" which
    includes concept-level understanding and interpretation of images and videos,
    event-centric understanding in videos to aid retrieval and reasoning, visual question
    answering and multimodal reasonign by leveraging external knowledge from various
