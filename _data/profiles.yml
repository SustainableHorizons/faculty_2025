  Biography (Maximum 200 words): 'Naw Safrin Sattar, Ph.D., is an assistant professor
    of high-performance computing in the Computer Science and Data Science Department
    in the School of Applied Computational Sciences at Meharry Medical College. Dr.
    Sattar’s research broadly covers high-performance computing, parallel algorithms,
    scalable large graph mining, big data analytics, machine learning/deep learning
    at scale, and generative AI. She seeks to support computational scientists and
    researchers by developing parallel algorithms to solve computationally expensive
    problems and achieve optimal performance on exascale HPC systems. Dr. Sattar has
    worked and collaborated at four Department of Energy national labs: Oak Ridge
    National Laboratory, Pacific Northwest National Laboratory, Lawrence Berkeley
    National Laboratory, and Los Alamos National Laboratory. These experiences provided
    her with the opportunity to work on different HPC systems. Collaborating at Berkeley
    Lab, she developed an optimized distributed parallel algorithm for dynamic graphs,
    the first MPI-based distributed community detection algorithm for dynamic graphs.
    During her postdoctoral research at ORNL, she worked on multiple projects, including
    Graph500 Benchmark on Frontier Supercomputer, Large Scale Graph Analytics for
    Heterogeneous Computing Platforms, and Machine Learning assisted HPC Operational
    Data Analytics. She serves as a technical committee member for ACM and IEEE conferences:
    Supercomputing (SC), IPDPS, Big Data, ISC, and others.'
