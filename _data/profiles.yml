  Research Synergy: My research interests spans multiple domains of data science and
    statistics with primary focus on developing, implementing and applying new statistical
    and AI/ML methodologies in the intersection of multivariate, nonparametric and
    robust statistics to solve various real-world problems in science and technology,
    engineering, business and economics, healthcare analytics, economics and finance,
    etc. The ever-expanding ubiquity of multivariate, especially high-dimensional,
    datasets requires new and flexible statistical techniques that are genuinely data-driven,
    self-adaptive and not too sensitive to contamination, missing entries or model
    misspecifications, etc. In harmony with NAIRR's objectives, an overarching goal
    of my research is to address these and other challenges of significant scientific
    and practical importance through innovative methodological research powered by
    modern public and private-sector AI resources as well advances in computing, in
    particular, HPC. Some of my recent research experience with AI/ML is also connected
    with my official capacity as an institutional partner of the Center for Trustworthy
    AI Through Model Risk Management (TAIM), which seeks to provide a framework to
