  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
    Describe your plan for working with your student team.'
  : During my postdoctoral research at Oak Ridge National Lab, I had the opportunity
    to work with 2 summer interns for a 10-week period similar to the SRP program
    timeline. I mentored a post-bachelor’s and a bachelor’s student through DOE-funded
    internship programs, and published several posters and a conference paper based
    on those internship projects. I used to decompose the project into multiple subtasks
    for each week, and observed their weekly progress. We met twice a week at the
    beginning and end of the week. These meetings helped keep track of the work of
    the previous week, ongoing tasks to accomplish in the current week, and how much
    work had been accomplished by the end of the week. I am responsive to emails whenever
    they need help. I always advise them to reach out early if they are stuck somewhere
    in between, and not to wait for regular meeting times. As my previous student
    interns were from a Computer Science background, my supervision strategy will
    be slightly different than before. I will continue the same pattern for weekly
    meetings. My supervision strategy for my student team with two master's students
    with basic coding and strong domain analysis skills is to implement the "Analyst-to-Scientist"
    Model. This accelerates their transition from simply analyzing data (the biology/R/Python
    background) to designing and executing large-scale computational experiments (AI/Big
    Data/HPC). While decomposing the problem for students, my focus will be on system
    complexity and networks. Whether it's genes or traffic, the core computational
    challenge is scaling, graph theory, and prediction. The students should see their
    existing knowledge as a superpower, not a limitation, enabling rapid adaptation
    to new data domains (geospatial, social, urban, etc). I will discuss and define
    the simplest end-to-end Big Data/AI/ML workflow achievable in 4-6 weeks. This
    will include generating subtasks from a task and ensuring an end-to-end workflow
    within the project scope. This will ensure a concrete result, even if the later
    weeks are exploratory. This will build confidence and provide a clear deliverable.
    This will prevent the students from experiencing anxiety associated with open-ended,
    complex tasks. I will make sure the students focus on the NAIRR resources or High-Performance
    Computing environment as the primary workspace from Day 1, and no local development
    will be encouraged. It will eliminate the technical "scaling gap" later and will
    force immediate proficiency with shell scripting and job management (SLURM) or
    other tools they need to use in the project. I will encourage them to maintain
    a code repository from the very beginning, so it is easily shareable if they face
    any problems. Instead of exhaustive training, I will guide them to custom computational
    toolkits for specific project needs (e.g., only the specific functions needed
    in PyTorch Geometric). This will foster rapid, self-directed learning —essential
    for an independent researcher. Finally, for the last weeks (Week 8-10), the student
    should be able to interpret the computational results into a compelling narrative
    and presentation. The deliverable is a fully documented code repository and a
    final presentation for the best computational approach for the problem they studied.
