  Motivation: As a new (&lt;3 years on tenure track) faculty member at UMBC, I am
    seeking opportunities to connect with collaborators on NAIRR projects, particularly
    the SCALE (Summer Camp for Applied Language Exploration). In addition to the obvious
    synergies and strong alignment between my background/interests and the NAIRR-funded
    project, my motivation is to become a crucial part of the larger research community
    in this area. As my new research group grows, I would like to establish new collaborations
    and reinforce existing collaborations with the dual goal of (1) working on exciting
    new topics and (2) providing my students mentorship and research opportunities
    beyond UMBC. The SRP program will allow me to work on larger scale problems (such
    as the topic of SCALE 2026) which wouldn't be possible for only one research group
    to carry out and thus necessitates the collaboration of many scientists, engineers,
    faculty, and students to push towards a big goal and make impact, faster and together.
    Science is rarely done in isolation and thus a community of like-minded researchers
    pushing towards a shared goal from different perspectives is exactly the sort
    of environment that I would like myself and my students to experience. One of
    my goals as a faculty member is to create future professors and SRP offers a summer
    experience that combines research projects with career development activities
    and is thus is a unique opportunity for my students to grow as independent researchers
    and get insights and feedback from multiple faculty members at various level.
