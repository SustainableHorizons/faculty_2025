  Biography (Maximum 200 words): Dr. Hailong Jiang is an Assistant Professor of Computer
    Science and Information Systems at Youngstown State University (YSU). His research
    centers on high-performance computing (HPC) resilience, compiler intermediate
    representations (LLVM and MLIR), and the integration of large language models
    (LLMs) for intelligent compiler analysis and optimization. Before joining YSU,
    he completed his Ph.D. in Computer Science at Kent State University, where he
    developed IR-level fault tolerance mechanisms and LLM-assisted code reasoning
    frameworks. Dr. Jiang currently leads several initiatives to build open-source
    datasets and tools that connect HPC compiler research with practical educational
    applications. His ongoing projects—such as LLM4IR and AAPAset—focus on leveraging
    AI to discover optimization opportunities that traditional compilers miss, particularly
    in GPU and vectorization pipelines. At YSU, he actively mentors undergraduate
    and graduate students in system-level programming, data structures, and operating
    systems, promoting project-based learning aligned with ABET outcomes. His broader
    goal is to create sustainable research pathways linking regional institutions
    to national laboratories. Through SRP, he aims to collaborate with DOE and NSF
    researchers on AI-driven compiler intelligence and performance-portable HPC workflows,
    providing students with authentic research experiences in scalable computing environments.
