    in solving complex scientific and biomedical challenges, particularly in the rapidly
    evolving field of precision medicine. With the increasing availability of high-dimensional
    genetic data, the integration of XAI and HPC offers a transformative opportunity
    to uncover meaningful biological insights, identify actionable biomarkers, and
    accelerate the discovery of targeted therapies. The Department of Energy (DOE)
    Laboratories possess cutting-edge HPC infrastructure and world-class expertise
    that are uniquely positioned to support and advance this type of computationally
    intensive research. To fully harness the potential of HPC in biomedical applications,
    it is vital to foster strong, sustained collaborative efforts between HBCU faculty-student
    research teams and DOE Lab scientists. The primary objective of this initiative
    is to promote interdisciplinary research collaborations that leverage the strengths
