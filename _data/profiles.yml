    the past participants (Dr. Sharmin Abdullah - a former student of mine, presently
    a collaborator and assistant professor at George Mason University), my students
    expressed their vivid interest in pursuing this opportunity. Having previously
    participated in SHI (successfully selected but not able to participate due to
