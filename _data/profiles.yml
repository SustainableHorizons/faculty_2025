  Please describe your research/academic interests.: My research interests are manifold.
    They include, but are not limited to, nonparametric and robust multivariate techniques
    in statistical/machine learning and AI, big data analytics, statistical process
    control, data mining, computational statistics, design and control of stochastic
    spatiotemporal systems, functional data analysis, etc. I have many years of successful
    experience with data science and machine learning, statistical and scientific
