  Please describe your research/academic interests.: I study intelligent systems at
    the intersection of applied mathematics, machine learning, and scientific computing.
    I build neural-network surrogates for cloud microphysics to accelerate climate
    models in collaboration with Lawrence Berkeley National Laboratory’s CLaSS group
    (with Dr. Damian Rouson). I also develop p-adic reaction–diffusion cellular neural
    networks with delay for modeling and image processing, and explainable AI for
    healthcare with a focus on early Alzheimer’s risk. Methodologically, my work draws
    on numerical PDEs, topology optimization, and high-performance, reproducible workflows
    using FEniCSx, PETSc, Python, and C++. I care about interpretability, uncertainty
    quantification, and open, reusable software that supports teaching and research.
    I serve as an Assistant Professor of Mathematics and Data Science at the College
    of Coastal Georgia and a Faculty Affiliate at LBNL.
  'Please select all the topical areas that apply to your project:': Applied Computer
    Science; Applied Mathematics; Artificial Intelligence and Intelligent Systems;
    Atmospheric Sciences; Climate and Global Dynamics; Informatics, Analytics and
    Information Science; Statistics and Probability
  Research Synergy: My team’s strengths align with SRP’s computational, AI, and data-centric
    projects. Surrogate modeling for cloud microphysics pairs naturally with atmospheric
    and climate modeling efforts; our numerical-PDE and optimization background supports
    stable, efficient training and evaluation on HPC systems. Techniques from p-adic
    CNNs (structure, stability, sparsity) inform model design and regularization that
    can transfer to other NAIRR-aligned AI tasks. In healthcare, our explainable models
    and uncertainty analysis complement projects seeking trustworthy predictions.
    Because we build open, reproducible workflows, our tools can be adopted by lab
    partners and adapted by student collaborators across disciplines.
  Motivation: 'I’m applying to SRP to deepen collaborations at the lab interface and
