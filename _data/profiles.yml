  ? 'Student Merit: Describe any past experience you have working with the each student
    on your team, and any other factors, such as their preparedness and/or aptitude,
    in your decision to include these students on your team.'
  : Samit K. Ghosh, MS is a Ph.D. student of mine. He is a fourth-year Ph.D. student
    in our Computational and Applied Mathematics Program. Currently, he is working
    on non-smooth optimization techniques in robust machine learning associated with
    trimmed likelihood maximization subject to regularization constraints and/or penalties.
    Being NP-hard mixed integer/continuous optimization problems, these problems are
    typically tackled with the concentration or C-step. Samit was able to show the
    equivalence between the C-step and the well-known Frank-Wolfe algorithm establishing
    the (optimal) linear convergence rate. Samit and I further plan to pursue related
    problems in parametric and nonparametric statistics as well as deep learning in
    the context of robust loss functions, which have recently gained popularity in
    science, engineering, business, finance, etc. Samit has a solid training in mathematics
    and data science, advanced computing and programming skills as well as great talent
    and passion for research. Lokanshu P. Malur has recently joined our PhD Program
    and is currently working under my supervision. Prior to joining ODU, he graduated
    from the Master of Science Program in Financial and Enterprise Risk Management
    at UConn, where I supervised his capstone project. In his capstone project, Lokanshu
    was working on a deep learning approach to optimal control problems with a feedback
    controller given by a neural network. Not only was Lokanshu able to grasp the
    theoretical side of this problem, but successfully managed to efficiently implement
    it in PyTorch/TensorFlow by writing a custom automatic differentiation routine
    to evaluate the Jacobian associated with this problem. The results he obtained
    are broadly applicable to deterministic optimal control problems in physics and
    engineering as well as stochastic optimal control problems in business, economics
    and finance. Lokanshu has a solid background in in applied mathematics, probability
    and statistics, econometric modeling, etc. His computational and programming skills
    are also superb. Based on these facts, I strongly believe that both Samit and
    Lokanshu will greatly benefit from a summer research project as part of Sustainable
    Research Pathways 2025. This will be an excellent opportunity for the students
    to broaden their academic horizons in connection with AI/ML and collect valuable
    collaboration experience with DOE and/or NAIRR project leads. Participation in
    SHI 2025 would encourage the students to pursue an academic career and be a truly
    transformational experience that would also likely inspire other students from
    the Hampton Roads region.
