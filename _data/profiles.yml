    AI interpretability, security and trust. I also have extensive experience with
    student training and curriculum development, in particular, in data science and
    AI/ML, including multiple NSF and DHHS/NIH funded projects. Currently, I'm also
    serving as a Graduate Program Director at Old Dominion University where I am commissioned
    with revising and modernizing our Big Data Analytics (BDA) curriculum as part
    of the PhD Program in Computational and Applied Mathematics. In line with NAIRR's
    goals, participating in SHI 2025 would help me to learn cutting edge AI/ML best
    practices and expand the AI workforce by training the next generation of AI researchers
    and educators.
  Motivation: The motivation for this application has multiple facets. Old Dominion
    University is a research university serving the culturally vibrant, yet socioeconomically
    challenged Southeastern Virginia/Hampton Roads region. Various challenges lead
    to adverse effects that limit career opportunities and professional growth of
    our students. Such effects are especially detrimental to young computational and
