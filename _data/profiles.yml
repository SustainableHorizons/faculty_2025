  Please describe your research/academic interests.: My research focuses on advancing
    the understanding of fluid mechanics, turbulence, hypersonic flow, and boundary
    layer transition through the synergistic use of computational fluid dynamics,
    scientific computing, and machine learning. I develop and apply physics-informed
    methods and physics-guided machine learning to capture nonlinearity, multiscale
    flow dynamics, and prediction using extreme regime modeling in hypersonic flow.
    By integrating high-fidelity simulations with data-driven approaches, we aim to
    establish digital twin frameworks that connect physics, computation, and data,
    delivering interpretable and real-time predictions of complex flows.
  'Please select all the topical areas that apply to your project:': Applied Computer
    Science; Applied Mathematics; Atmospheric Sciences; Climate and Global Dynamics;
    Fluid and Plasma Physics; Hydrology and Water Resources; Mechanical Engineering
  Research Synergy: My research focuses on the interface between mechanical engineering,
    applied mathematics, and applied computer science, integrating fluid mechanics,
    turbulence, hypersonic flow, and boundary layer transition, where emerging paradigms
    in science-based machine learning and high-performance computing are being explored.
    These efforts naturally extend into atmospheric sciences, climate dynamics, and
    hydrology, as the multiscale principles governing transition and turbulence in
    aerospace flows lead to large-scale circulation in geophysics, water transport,
    and environmental variability. By unifying computational physics and data-driven
    modeling, my work develops digital twin frameworks that transcend disciplinary
    boundaries, enabling predictive capabilities that inform aerospace applications
    and Earth system sciences. In this way, my research combines the rigor of mathematics
    and computation with the complexity of natural and engineering systems, creating
    a common language across fields that have been studied in silos.
  Motivation: The reason I want to participate in the program is that I want to learn
    from and be known by the entire computational science community. I want to be
    recognized by the community and form relationships that lead to collaborations,
    allowing my students and me to learn from the world's best computational scientists.
    At the same time, I want to have a relationship where they offer computational
    resources (Perlmutter hours) to my research group. I want the community to support
    me and get to know me through my work, including publishing articles together,
    and building a relationship of trust based on my work. I am interested in collaborating
    with individuals who work in fluids, scientific computing, machine learning, and
    computational science more broadly. I aim to expand and develop my knowledge in
    applied mathematics, high-performance computing, and numerical methods theory
    by collaborating with scientists at Berkeley Lab.
  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
    Describe your plan for working with your student team.'
  : I plan to oversee student teams focused on structured mentoring, collaborative
    learning, and independent growth. I will begin by defining a project with our
    mentors/coworkers, outlining objectives, milestones, and expected outcomes, to
    ensure that students understand their technical goals and the purpose of their
    work. I will meet with my team on a weekly basis to guide them, review their progress,
    and provide assistance if they encounter any issues. I will always support my
    students in their independent endeavors, while also being there for them when
    they need guidance. Each student's role will be aligned with their strengths and
    areas of research in which they want to grow, leading to professional development.
    I will emphasize the integration of computational tools, scientific reasoning,
    and effective communication, helping students document their work and present
    their results in various formats, including mathematical, scientific, written,
    and oral presentations. My role is to be a guide, not a dictator, ensuring that
    students learn, collaborate, and develop the confidence to solve complex problems
    independently.
  ? 'Student Merit: Describe any past experience you have working with the each student
    on your team, and any other factors, such as their preparedness and/or aptitude,
    in your decision to include these students on your team.'
  : I have known my two students since June 2025; they are two of my master's students.
    One works on shock wave simulations and finite differences, and the other on deep
    learning. They are both always very enthusiastic and eager to learn. Javi (Avinash)
    meets with me every week and will be publishing his work in my Finite-JAX library,
    where he simulated the Burgers equation using finite differences in Finite-JAX
    and without JAX, in the division of fluid dynamics in the American Physical Society.
    He has already finished the presentation, which is available on ResearchGate.
    He is extremely hardworking and positive. The other student, Gopi (Gopishwar),
    is meticulous, enthusiastic, hardworking, and always asks a lot of questions.
    He ensures that every time we define a theory and its associated mathematics,
    everything is correct. This includes matrix multiplications, linear systems, and
    the underlying mathematics, such as activation functions, which create nonlinearities
    in neural networks. Javi is already working on his thesis and is expected to graduate
    in December 2026. Gopi is scheduled to graduate in May 2026 and is currently working
    on the background for his thesis.
