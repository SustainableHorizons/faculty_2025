  : I met both Haran and Teja recently through a research idea I advertised to students
    in robotics. We began discussing a topic of shared interest — extending control
    theory techniques used in robotics for safe navigation to safe chain-of-thought
    reasoning in the context of large language models (LLMs). One promising direction
    we identified is the use of Control Barrier Functions within the chain-of-thought
    (CoT) process to enforce CoT safety. Both students demonstrated a strong interest
    in bridging their robotics background with emerging developments in AI through
    a structured mathematical perspective. They are motivated, curious, and eager
    to engage with established researchers across related fields. Haran has a solid
    background in control theory and is a member of the IRIS Lab at ASU. The work
    conducted in the IRIS Lab — particularly on contact-rich manipulation and the
    design of control and optimization methods for safe autonomous systems, aligns
    closely with my own research expertise. Teja is another excellent student who
    is enthusiastic about connecting AI methodologies with classical robotics principles.
    He has a solid foundation in applied mathematics, has participated in AI hackathons,
    and has contributed to several AI–robotics coding projects, demonstrating both
    initiative and technical versatility. In summary, both students possess the aptitude,
    motivation, and collaborative spirit necessary for this program. I am confident
    that their participation will not only strengthen our project’s interdisciplinary
    focus but also provide them with valuable exposure and professional growth within
    the broader research community.
