  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
    Describe your plan for working with your student team.'
  : My plan for supervising my student team is based on structured mentorship, clear
    communication, and professional development. Before the summer program begins,
    we will hold several meetings to align the students' learning objectives with
    the target project. We will identify the necessary technical skills for the target
    project and establish expectations for teamwork and communication, preparing the
    whole team for the program's first day. Throughout the 10-week onsite summer experience,
    my mentorship will be hands-on and structured. We will have a daily conclusion
    to record progress and address immediate issues. Additionally, we will hold a
    weekly group meeting to review progress, discuss relevant literature, and plan
    for the upcoming week. A key component of my mentorship is to encourage students
    to take ownership of their research, solve problems independently, and propose
    their own research ideas. Besides the research, I will also spend time on their
    professional development, helping them establish their network, refine their presentation
    skills, and explore future career directions. After the 10-week program, I will
    work with my team to share the preliminary results by preparing a conference paper
    and presenting our findings. As their PhD supervisor at UTRGV, I will continue
    to provide academic and career advice, write letters of recommendation if needed,
    and support the students' success in their future research and careers.
