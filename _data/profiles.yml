  Research Synergy: My research interests are fundamentally aligned with the mission
    of Sustainable Research Pathway and NSF National Artificial Intelligence Research
    Resource Pilot. One recent investigation of our team is the development of Generative
    Behavior-Augmented Digital Twin to strengthen infrastructure and social resilience
    against natural disasters, such as flooding. The key is to include human behavior
    into the AI system for designing the digital replica of the realistic system.
    This effort not merely overlaps with the core project goals of NAIRR Pilot and
    SRP, but also actively strengthens the underlying computational architecture and
    resolves the critical research challenges necessary for the successful deployment
    of AI. Our work lies at the interfaces of complex system, AI, network science,
    industrial engineering, providing the fine-grained solutions needed to transition
    the twin from a conceptual model to a computationally tractable, validated decision-support
    tool.
  Motivation: 'My participation in the SRP is aimed at enhancing my research and teaching
    capacity: 1. My current project faces the computational challenge, specifically,
    running a hybrid simulation of agents and a high-resolution hydrodynamic model
    faster than real-time. The SRP offers critical access to the NAIRR ecosystem and
    expertise in distributed computing, which is indispensable for solving this scaling
    problem and making the digital twin a deployable reality. I seek collaboration
    with experts to solidify my research, which will lead to top publications and
    research grant. 2. I plan to translate the advanced computational and modeling
    practices I could learn at SRP directly back to my home institution. I hope to
    integrate modules on ethical AI, probabilistic modeling, and digital twin into
    my course offering SSIE643 Advanced Engineering Analytics, thereby creating a
    sustainable educational pathway that prepares my students for high-impact, interdisciplinary
    careers. This course covers the mathematics of advanced AI models for engineering
    students, and I am actively adding new content to educate myself and the students.'
  ? 'Supervising Students: Faculty are responsible for supervising their student teams.
