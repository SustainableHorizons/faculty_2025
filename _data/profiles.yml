  Please describe your research/academic interests.: My research interests center
    on technology-supported STEM education, with a particular focus on engineering
    and computing education, online and distance learning, and teacher/faculty professional
    development. In engineering education, I investigate strategies to repair and
    prevent student misconceptions of challenging concepts, while in computing education
    my work emphasizes strengthening critical thinking, problem solving, the integration
    of AI in education, and examining the societal impact of computing. I am also
    interested in embedding sustainability and resilience into undergraduate engineering
    curricula, and in developing strategies to introduce clean and renewable energy
    concepts through innovative approaches such as data visualization and virtual/augmented
    reality. My scholarship is intentionally interdisciplinary, drawing on engineering,
    computing, education, and the learning sciences to generate scalable solutions
    to complex educational challenges. Through community partnerships and collaborative
    research initiatives, I aim to create effective learning environments that not
    only enhance student learning and engagement in digital contexts but also extend
    the reach and impact of research beyond academia to address broader societal needs.
